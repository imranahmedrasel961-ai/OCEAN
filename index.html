F<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OCEAN</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b1220;
      color: white;
      text-align: center;
    }

    header {
      padding: 25px 15px;
      background: #111c33;
    }

    h1 {
      color: #28a9ff;
      font-size: 42px;
      margin: 10px 0;
    }

    p {
      color: #cbd5e1;
      font-size: 18px;
    }

    .container {
      padding: 40px 20px;
    }

    .card {
      max-width: 500px;
      margin: auto;
      padding: 30px;
      background: #17233b;
      border-radius: 15px;
    }

    button {
      margin-top: 20px;
      padding: 14px 30px;
      border: none;
      border-radius: 8px;
      background: #1683e8;
      color: white;
      font-size: 17px;
      cursor: pointer;
    }

    button:hover {
      background: #0d6fc5;
    }
  </style>
</head>

<body>

  <header>
    <h1>OCEAN</h1>
    <p>Welcome to OCEAN</p>
  </header>

  <div class="container">
    <div class="card">
      <h2>Welcome</h2>
      <p>This is your first OCEAN website.</p>

      <button onclick="showMessage()">Get Started</button>

      <p id="message"></p>
    </div>
  </div>

  <script>
    function showMessage() {
      document.getElementById("message").innerText =
        "Welcome! Your website is working.";
    }
  </script>

</body>
</html>
